<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JPG to PDF</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <header class="mobile-header">
          <a href="/" class="dashboard-link">Dashboard</a>
        </header>

        <div class="upload-screen" id="uploadScreen">
          <h1>JPG to PDF</h1>
          <p class="subtitle">
            Convert JPG images to PDF in seconds. Easily adjust orientation and
            margins.
          </p>

          <form id="uploadForm" enctype="multipart/form-data">
            <input
              type="file"
              id="images"
              name="images"
              accept=".png,.jpg,.jpeg,.webp,.bmp,.tiff"
              multiple
              hidden
            />

            <button type="button" class="select-button" id="selectButton">
              Select JPG images
            </button>

            <p class="drop-hint">or drop JPG images here</p>
            <p class="format-hint">Supports JPG, PNG, WEBP, BMP and TIFF</p>
          </form>

          <div class="upload-error" id="uploadError" role="alert"></div>
        </div>

        <div class="editor hidden" id="editor">
          <div class="editor-toolbar">
            <button
              type="button"
              id="addImagesButton"
              class="add-button"
              title="Add images"
            >
              +
            </button>
            <button
              type="button"
              id="sortButton"
              class="sort-button"
              title="Sort images by name"
            >
              A–Z
            </button>
          </div>

          <div class="image-grid" id="imageGrid"></div>

          <div class="editor-footer">
            <button
              type="button"
              class="secondary-button"
              id="chooseMoreButton"
            >
              Add more images
            </button>
            <button type="button" class="secondary-button" id="clearButton">
              Clear all
            </button>
          </div>
        </div>

        <div class="mobile-convert">
          <button type="button" id="mobileConvertButton" class="convert-button">
            Convert to PDF <span aria-hidden="true">➜</span>
          </button>
        </div>
      </section>

      <aside class="options-panel">
        <div class="options-heading">
          <h2>Image to PDF options</h2>
        </div>

        <div class="options-content">
          <section class="option-group">
            <h3>Page orientation</h3>
            <div class="choice-grid two-columns">
              <button
                type="button"
                class="choice-card selected"
                data-option="orientation"
                data-value="portrait"
              >
                <svg viewBox="0 0 32 40" aria-hidden="true">
                  <rect x="5" y="3" width="22" height="34" rx="1" />
                </svg>
                <span>Portrait</span>
              </button>

              <button
                type="button"
                class="choice-card"
                data-option="orientation"
                data-value="landscape"
              >
                <svg viewBox="0 0 40 30" aria-hidden="true">
                  <rect x="3" y="4" width="34" height="22" rx="1" />
                </svg>
                <span>Landscape</span>
              </button>
            </div>
          </section>

          <section class="option-group">
            <label for="pageSize">Page size</label>
            <select id="pageSize" name="page_size">
              <option value="A4" selected>A4 (297×210 mm)</option>
              <option value="A3">A3 (420×297 mm)</option>
              <option value="A5">A5 (210×148 mm)</option>
              <option value="LETTER">US Letter (8.5×11 in)</option>
              <option value="LEGAL">US Legal (8.5×14 in)</option>
            </select>
          </section>

          <section class="option-group">
            <h3>Margin</h3>
            <div class="choice-grid three-columns">
              <button
                type="button"
                class="choice-card selected"
                data-option="margin"
                data-value="none"
              >
                <svg viewBox="0 0 40 40" aria-hidden="true">
                  <rect x="3" y="3" width="34" height="34" rx="1" />
                  <path d="M9 27l7-9 5 5 4-7 7 11z" class="icon-fill" />
                  <circle cx="13" cy="12" r="2" class="icon-fill" />
                </svg>
                <span>No margin</span>
              </button>

              <button
                type="button"
                class="choice-card"
                data-option="margin"
                data-value="small"
              >
                <svg viewBox="0 0 40 40" aria-hidden="true">
                  <rect
                    x="3"
                    y="3"
                    width="34"
                    height="34"
                    stroke-dasharray="2 2"
                  />
                  <rect x="9" y="9" width="22" height="22" />
                  <path d="M12 25l5-7 4 4 3-5 5 8z" class="icon-fill" />
                </svg>
                <span>Small</span>
              </button>

              <button
                type="button"
                class="choice-card"
                data-option="margin"
                data-value="big"
              >
                <svg viewBox="0 0 40 40" aria-hidden="true">
                  <rect
                    x="3"
                    y="3"
                    width="34"
                    height="34"
                    stroke-dasharray="2 2"
                  />
                  <rect x="11" y="11" width="18" height="18" />
                  <path d="M13 24l4-6 4 4 3-4 4 6z" class="icon-fill" />
                </svg>
                <span>Big</span>
              </button>
            </div>
          </section>

          <label class="merge-option">
            <input type="checkbox" id="mergeImages" checked />
            <span class="custom-checkbox" aria-hidden="true">✓</span>
            <span>Merge all images in one PDF file</span>
          </label>

          <p class="options-error" id="optionsError" role="alert"></p>

          <button type="button" id="convertButton" class="convert-button">
            Convert to PDF <span aria-hidden="true">➜</span>
          </button>
        </div>
      </aside>
    </main>

    <script>
      const fileInput = document.getElementById("images");
      const uploadForm = document.getElementById("uploadForm");
      const uploadScreen = document.getElementById("uploadScreen");
      const editor = document.getElementById("editor");
      const imageGrid = document.getElementById("imageGrid");
      const selectButton = document.getElementById("selectButton");
      const addImagesButton = document.getElementById("addImagesButton");
      const chooseMoreButton = document.getElementById("chooseMoreButton");
      const clearButton = document.getElementById("clearButton");
      const sortButton = document.getElementById("sortButton");
      const uploadError = document.getElementById("uploadError");
      const optionsError = document.getElementById("optionsError");
      const convertButton = document.getElementById("convertButton");
      const mobileConvertButton = document.getElementById(
        "mobileConvertButton",
      );

      const allowedExtensions = new Set([
        "png",
        "jpg",
        "jpeg",
        "webp",
        "bmp",
        "tiff",
      ]);

      const MAX_UPLOAD_SIZE = 2 * 1024 * 1024 * 1024;

      let selectedFiles = [];
      let orientation = "portrait";
      let margin = "none";
      let sortAscending = true;
      let isConverting = false;

      function showUploadError(message) {
        uploadError.textContent = message;
      }

      function extensionOf(filename) {
        return filename.split(".").pop().toLowerCase();
      }

      function addFiles(fileList) {
        const incoming = Array.from(fileList || []);
        const accepted = [];
        const rejected = [];

        for (const file of incoming) {
          if (!allowedExtensions.has(extensionOf(file.name))) {
            rejected.push(file.name);
            continue;
          }

          if (
            selectedFiles.some(
              (existing) =>
                existing.name === file.name &&
                existing.size === file.size &&
                existing.lastModified === file.lastModified,
            )
          ) {
            continue;
          }

          accepted.push(file);
        }

        selectedFiles.push(...accepted);

        showUploadError(
          rejected.length
            ? "Unsupported file type: " + rejected.join(", ")
            : "",
        );

        renderImages();
      }

      function renderImages() {
        imageGrid.replaceChildren();

        selectedFiles.forEach((file, index) => {
          const card = document.createElement("article");
          card.className = "image-card";

          const preview = document.createElement("div");
          preview.className = "image-preview";

          const image = document.createElement("img");
          image.alt = file.name;
          image.loading = "lazy";

          const previewUrl = URL.createObjectURL(file);
          image.src = previewUrl;
          image.onload = () => URL.revokeObjectURL(previewUrl);
          image.onerror = () => URL.revokeObjectURL(previewUrl);

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove-image";
          remove.textContent = "×";
          remove.title = "Remove " + file.name;
          remove.setAttribute("aria-label", "Remove " + file.name);

          remove.addEventListener("click", () => {
            selectedFiles.splice(index, 1);
            renderImages();
          });

          const filename = document.createElement("p");
          filename.className = "image-filename";
          filename.title = file.name;
          filename.textContent = file.name;

          const number = document.createElement("span");
          number.className = "image-number";
          number.textContent = String(index + 1);

          preview.append(image, remove, number);
          card.append(preview, filename);
          imageGrid.append(card);
        });

        const hasFiles = selectedFiles.length > 0;
        uploadScreen.classList.toggle("hidden", hasFiles);
        editor.classList.toggle("hidden", !hasFiles);
      }

      function openFilePicker() {
        fileInput.click();
      }

      selectButton.addEventListener("click", openFilePicker);
      addImagesButton.addEventListener("click", openFilePicker);
      chooseMoreButton.addEventListener("click", openFilePicker);

      fileInput.addEventListener("change", () => {
        addFiles(fileInput.files);
        fileInput.value = "";
      });

      clearButton.addEventListener("click", () => {
        selectedFiles = [];
        showUploadError("");
        optionsError.textContent = "";
        renderImages();
      });

      sortButton.addEventListener("click", () => {
        selectedFiles.sort((a, b) =>
          sortAscending
            ? a.name.localeCompare(b.name)
            : b.name.localeCompare(a.name),
        );

        sortAscending = !sortAscending;
        sortButton.textContent = sortAscending ? "A–Z" : "Z–A";
        renderImages();
      });

      document.querySelectorAll(".choice-card").forEach((button) => {
        button.addEventListener("click", () => {
          const option = button.dataset.option;
          const value = button.dataset.value;

          document
            .querySelectorAll('.choice-card[data-option="' + option + '"]')
            .forEach((card) => card.classList.remove("selected"));

          button.classList.add("selected");

          if (option === "orientation") orientation = value;
          if (option === "margin") margin = value;
        });
      });

      ["dragenter", "dragover"].forEach((eventName) => {
        uploadForm.addEventListener(eventName, (event) => {
          event.preventDefault();
          uploadForm.classList.add("drag-active");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        uploadForm.addEventListener(eventName, (event) => {
          event.preventDefault();
          uploadForm.classList.remove("drag-active");
        });
      });

      uploadForm.addEventListener("drop", (event) => {
        addFiles(event.dataTransfer.files);
      });

      document.addEventListener("dragover", (event) => event.preventDefault());
      document.addEventListener("drop", (event) => event.preventDefault());

      async function convertToPdf() {
        if (isConverting) return;

        optionsError.textContent = "";

        if (selectedFiles.length === 0) {
          showUploadError("Please select at least one image.");
          return;
        }

        const totalSize = selectedFiles.reduce(
          (sum, file) => sum + file.size,
          0,
        );

        if (totalSize > MAX_UPLOAD_SIZE) {
          optionsError.textContent =
            "Selected files exceed the 2 GB upload limit.";
          return;
        }

        const formData = new FormData();

        selectedFiles.forEach((file) => {
          formData.append("images", file, file.name);
        });

        formData.append("orientation", orientation);
        formData.append("page_size", document.getElementById("pageSize").value);
        formData.append("margin", margin);
        formData.append(
          "merge",
          document.getElementById("mergeImages").checked ? "true" : "false",
        );

        isConverting = true;

        const buttons = [convertButton, mobileConvertButton];

        buttons.forEach((button) => {
          button.disabled = true;
          button.dataset.originalText = button.innerHTML;
          button.textContent = "Converting...";
        });

        try {
          const response = await fetch("/image-to-pdf/convert", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            const contentType = response.headers.get("content-type") || "";
            let message = `Conversion failed (HTTP ${response.status}).`;

            try {
              if (contentType.includes("application/json")) {
                const result = await response.json();
                message = result.error || message;
              } else {
                const text = await response.text();
                if (text) message = text;
              }
            } catch (_error) {
              // Keep HTTP status message.
            }

            throw new Error(message);
          }

          const blob = await response.blob();

          if (!blob.size) {
            throw new Error("The server returned an empty PDF.");
          }

          const downloadUrl = URL.createObjectURL(blob);
          const link = document.createElement("a");

          link.href = downloadUrl;
          link.download = "converted-images.pdf";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        } catch (error) {
          console.error("Image-to-PDF conversion failed:", error);
          optionsError.textContent =
            error.message || "Conversion failed. Check the server logs.";
        } finally {
          isConverting = false;

          buttons.forEach((button) => {
            button.disabled = false;
            button.innerHTML = button.dataset.originalText;
          });
        }
      }

      convertButton.addEventListener("click", convertToPdf);
      mobileConvertButton.addEventListener("click", convertToPdf);
    </script>
  </body>
</html>
