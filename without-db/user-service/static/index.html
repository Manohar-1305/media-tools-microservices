<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>User Account | Media Tools</title>
    <link rel="stylesheet" href="/user/static/style.css?v=20261021-4">
</head>
<body>
    <main class="account-container">
        <a class="back-link" href="/">
            <span aria-hidden="true">←</span> Media Tools
        </a>

        <section class="account-card">
            <div class="brand-mark" aria-hidden="true">M</div>

            <h1 id="page-title">Create your account</h1>
            <p id="page-description" class="page-description">
                Get started with your Media Tools account.
            </p>

            <div class="tabs" id="account-tabs" role="tablist">
                <button id="register-tab" type="button"
                        role="tab" aria-selected="true"
                        onclick="showMode('register')">
                    Create Account
                </button>
                <button id="login-tab" type="button"
                        role="tab" aria-selected="false"
                        onclick="showMode('login')">
                    Login
                </button>
            </div>

            <form id="register-form">
                <label for="register-username">Username</label>
                <input id="register-username" name="username"
                       placeholder="Choose a username"
                       autocomplete="username" required>

                <label for="register-email">Email address</label>
                <input id="register-email" name="email" type="email"
                       placeholder="you@example.com"
                       autocomplete="email" required>

                <label for="register-password">Password</label>
                <input id="register-password" name="password" type="password"
                       placeholder="At least 8 characters"
                       autocomplete="new-password" minlength="8" required>

                <button class="submit-button" type="submit">
                    Create Account <span aria-hidden="true">→</span>
                </button>

                <p class="form-footer">
                    Already have an account?
                    <button class="text-button" type="button"
                            onclick="showMode('login')">Sign in</button>
                </p>
            </form>

            <form id="login-form" hidden>
                <label for="login-username">Username or email</label>
                <input id="login-username" name="username"
                       placeholder="Enter your username or email"
                       autocomplete="username" required>

                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password"
                       placeholder="Enter your password"
                       autocomplete="current-password" required>

                <div class="form-options">
                    <a href="/user/forgot-password">Forgot password?</a>
                </div>

                <button class="submit-button" type="submit">
                    Sign In <span aria-hidden="true">→</span>
                </button>

                <p class="form-footer">
                    New to Media Tools?
                    <button class="text-button" type="button"
                            onclick="showMode('register')">Create an account</button>
                </p>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <div class="security-note">
                <span aria-hidden="true">🔒</span>
                Your account information is protected.
            </div>
        </section>

        <footer class="page-footer">
            Media Tools &middot; Your tools, all in one place
        </footer>
    </main>

    <script>
        const registerForm = document.getElementById("register-form");
        const loginForm = document.getElementById("login-form");
        const message = document.getElementById("message");

        function showMessage(text, type = "") {
            message.textContent = text;
            message.className = type;
        }

        function showMode(mode) {
            const isLogin = mode === "login";

            registerForm.hidden = isLogin;
            loginForm.hidden = !isLogin;

            document.getElementById("page-title").textContent =
                isLogin ? "Welcome back" : "Create your account";

            document.getElementById("page-description").textContent =
                isLogin
                    ? "Sign in to continue to Media Tools."
                    : "Get started with your Media Tools account.";

            document.getElementById("register-tab").classList.toggle("active", !isLogin);
            document.getElementById("login-tab").classList.toggle("active", isLogin);

            document.getElementById("register-tab").setAttribute(
                "aria-selected", String(!isLogin)
            );
            document.getElementById("login-tab").setAttribute(
                "aria-selected", String(isLogin)
            );

            showMessage("");

            const url = new URL(window.location.href);
            url.searchParams.set("mode", mode);
            window.history.replaceState({}, "", url);
        }

        async function submitForm(event, endpoint) {
            event.preventDefault();
            const form = event.currentTarget;
            const submitButton = form.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;

            submitButton.disabled = true;
            submitButton.textContent = "Please wait...";
            showMessage("Processing your request...");

            const payload = Object.fromEntries(new FormData(form).entries());

            try {
                const response = await fetch("/user/" + endpoint, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Request failed");
                }

                if (endpoint === "login") {
                    localStorage.setItem("mediaToolsUsername", result.user.username);
                    localStorage.setItem("mediaToolsEmail", result.user.email);
                    window.location.replace("/");
                    return;
                }

                form.reset();
                showMode("login");
                showMessage(
                    "Account created successfully. You can now sign in.",
                    "success"
                );
            } catch (error) {
                showMessage(
                    error.message || "Unable to contact the user service.",
                    "error"
                );
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = originalText;
            }
        }

        registerForm.addEventListener("submit", event =>
            submitForm(event, "register")
        );

        loginForm.addEventListener("submit", event =>
            submitForm(event, "login")
        );

        const initialMode =
            new URLSearchParams(window.location.search).get("mode");

        showMode(initialMode === "login" ? "login" : "register");
    </script>
</body>
</html>
