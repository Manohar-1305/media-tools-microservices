<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Account | Media Tools</title>
    <link rel="stylesheet" href="/user/static/style.css">
</head>
<body>
    <main class="account-container">
        <a class="back-link" href="/">← Media Tools</a>

        <section class="account-card">
            <h1 id="page-title">Create Account</h1>
            <p id="page-description">Create an account to get started.</p>

            <div class="tabs">
                <button id="register-tab" type="button" onclick="showMode('register')">
                    Create Account
                </button>
                <button id="login-tab" type="button" onclick="showMode('login')">
                    Login
                </button>
            </div>

            <form id="register-form">
                <label for="register-username">Username</label>
                <input id="register-username" name="username"
                       autocomplete="username" required>

                <label for="register-email">Email</label>
                <input id="register-email" name="email" type="email"
                       autocomplete="email" required>

                <label for="register-password">Password</label>
                <input id="register-password" name="password" type="password"
                       autocomplete="new-password" minlength="8" required>

                <button class="submit-button" type="submit">Create Account</button>
            </form>

            <form id="login-form" hidden>
                <label for="login-username">Username or Email</label>
                <input id="login-username" name="username"
                       autocomplete="username" required>

                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password"
                       autocomplete="current-password" required>

                <button class="submit-button" type="submit">Login</button>
            </form>

            <p id="message" role="status"></p>
        </section>
    </main>

    <script>
        const registerForm = document.getElementById("register-form");
        const loginForm = document.getElementById("login-form");
        const message = document.getElementById("message");

        function showMode(mode) {
            const isLogin = mode === "login";

            registerForm.hidden = isLogin;
            loginForm.hidden = !isLogin;

            document.getElementById("page-title").textContent =
                isLogin ? "Login" : "Create Account";

            document.getElementById("page-description").textContent =
                isLogin
                    ? "Sign in to your account."
                    : "Create an account to get started.";

            document.getElementById("register-tab").classList.toggle("active", !isLogin);
            document.getElementById("login-tab").classList.toggle("active", isLogin);

            message.textContent = "";
            message.className = "";

            const url = new URL(window.location.href);
            url.searchParams.set("mode", mode);
            window.history.replaceState({}, "", url);
        }

        async function submitForm(event, endpoint) {
            event.preventDefault();

            message.textContent = "Please wait...";
            message.className = "";

            const form = event.currentTarget;
            const payload = Object.fromEntries(new FormData(form).entries());

            try {
                const response = await fetch("/user/" + endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Request failed");
                }

                if (endpoint === "login") {
                    localStorage.setItem(
                        "mediaToolsUsername",
                        result.user.username
                    );
                    window.location.href = "/";
                    return;
                }

                form.reset();
                showMode("login");
                message.textContent =
                    "Account created successfully. You can now log in.";
                message.className = "success";

            } catch (error) {
                message.textContent =
                    error.message || "Unable to contact the user service.";
                message.className = "error";
            }
        }

        registerForm.addEventListener("submit", event =>
            submitForm(event, "register")
        );

        loginForm.addEventListener("submit", event =>
            submitForm(event, "login")
        );

        const initialMode =
            new URLSearchParams(window.location.search).get("mode");

        showMode(initialMode === "login" ? "login" : "register");
    </script>
</body>
</html>
