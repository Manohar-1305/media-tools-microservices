<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Forgot Password | Media Tools</title>
    <link rel="stylesheet" href="/user/static/style.css?v=20261021-4">
</head>
<body>
    <main class="account-container">
        <a class="back-link" href="/">
            <span aria-hidden="true">←</span> Media Tools
        </a>

        <section class="account-card">
            <div class="brand-mark" aria-hidden="true">M</div>

            <h1>Forgot password?</h1>
            <p class="page-description">
                No worries. Enter your registered email address and we'll send you a temporary password.
            </p>

            <form id="forgot-password-form">
                <label for="email">Registered email address</label>
                <input id="email" name="email" type="email"
                       placeholder="you@example.com"
                       autocomplete="email" required>

                <button class="submit-button" type="submit">
                    Send Temporary Password <span aria-hidden="true">→</span>
                </button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <div class="form-footer">
                Remember your password?
                <a class="text-button" href="/user/?mode=login">Back to login</a>
            </div>

            <div class="security-note">
                <span aria-hidden="true">🔒</span>
                Your account information is protected.
            </div>
        </section>

        <footer class="page-footer">
            Media Tools &middot; Your tools, all in one place
        </footer>
    </main>

    <script>
        const form = document.getElementById("forgot-password-form");
        const message = document.getElementById("message");
        const submitButton = form.querySelector('button[type="submit"]');

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const originalText = submitButton.textContent;
            submitButton.disabled = true;
            submitButton.textContent = "Sending...";
            message.textContent = "Please wait...";
            message.className = "";

            try {
                const response = await fetch("/user/forgot-password", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim()
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Unable to process your request.");
                }

                message.textContent = result.message;
                message.className = "success";
                form.reset();
            } catch (error) {
                message.textContent =
                    error.message || "Unable to contact the user service.";
                message.className = "error";
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = originalText;
            }
        });
    </script>
</body>
</html>
